[package]
name = "pauliprop-py"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pauliprop = { path = "../core" }
rayon = "1"
pyo3 = { version = "0.25", features = ["extension-module", "abi3-py310", "num-complex"] }
